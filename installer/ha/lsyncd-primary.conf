-- HostPanel HA: lsyncd config running on the PRIMARY, pushing changes to the STANDBY.
-- Watches /var/www, /var/mail, /etc/nginx/sites-* via inotify; rsyncs deltas with ~1s lag.
--
-- After failover, the new primary loads its mirror of this file (lsyncd-standby.conf) so
-- writes flow back to the former primary. Bidirectional reverses on failover; never both ways at once.
--
-- Deploy: copy to /etc/lsyncd/lsyncd.conf.lua on the primary, then `systemctl enable --now lsyncd`.
-- Apt install: `apt-get install -y lsyncd` (in installer's install_base step).

settings {
    logfile    = "/var/log/lsyncd/lsyncd.log",
    statusFile = "/var/log/lsyncd/lsyncd.status",
    statusInterval = 20,
    nodaemon   = false,
    insist     = true,    -- keep running even if standby is briefly unreachable
    maxProcesses = 4,
}

-- These four values are written by the panel when HA is configured. Don't hand-edit.
local standby_host = os.getenv("HA_STANDBY_HOST") or "192.168.10.236"
local ssh_user     = os.getenv("HA_SSH_USER")     or "mgardner"
local ssh_key      = os.getenv("HA_SSH_KEY")      or "/etc/hostpanel/ha-rsync-key"
local ssh_opts     = "-i " .. ssh_key .. " -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/etc/hostpanel/ha-known-hosts"

local function rsync_target(remote_path)
    return ssh_user .. "@" .. standby_host .. ":" .. remote_path
end

local base = {
    delay = 1,                         -- 1s debounce (batches rapid writes)
    rsync = {
        compress = true,
        archive  = true,
        verbose  = false,
        owner    = true, group = true, perms = true,
        rsh      = "/usr/bin/ssh " .. ssh_opts,
        rsync_path = "sudo rsync",      -- write to root-owned paths on the standby
        _extra   = { "--numeric-ids", "--inplace", "--delete" }
    },
}

-- Tenant docroots — high churn, low file size.
sync { default.rsync, source = "/var/www/",  target = rsync_target("/var/www/"),  base, delay = 1 }

-- Mail Maildirs — moderate churn, mostly small files.
sync { default.rsync, source = "/var/mail/", target = rsync_target("/var/mail/"), base, delay = 2 }

-- Nginx site configs — rare writes, but critical for failover (so customer vhosts work).
sync { default.rsync, source = "/etc/nginx/sites-available/", target = rsync_target("/etc/nginx/sites-available/"), base, delay = 1 }
sync { default.rsync, source = "/etc/nginx/sites-enabled/",   target = rsync_target("/etc/nginx/sites-enabled/"),   base, delay = 1 }

-- Panel config + agent token (rotates infrequently, but must be in sync for JWT validation).
-- EXCLUDE: ssl/ (each panel has its own self-signed UI cert), ha-rsync-key* (per-panel SSH identity),
-- ha-known-hosts (built locally per-panel). The shared bits are agent.token + setup state files.
sync {
    default.rsync,
    source = "/etc/hostpanel/",
    target = rsync_target("/etc/hostpanel/"),
    delay = 5,
    rsync = {
        compress = true, archive = true, owner = true, group = true, perms = true,
        rsh = "/usr/bin/ssh " .. ssh_opts,
        rsync_path = "sudo rsync",
        _extra = {
            "--numeric-ids", "--inplace",
            "--exclude=ssl/", "--exclude=ha-rsync-key*", "--exclude=ha-known-hosts"
        }
    }
}

-- Let's Encrypt cert store (only if present — panel can also use /etc/hostpanel/ssl via SslService).
local function dir_exists(p)
    local f = io.open(p, "r"); if f ~= nil then io.close(f); return true end; return false
end

if dir_exists("/etc/letsencrypt/") then
    sync { default.rsync, source = "/etc/letsencrypt/", target = rsync_target("/etc/letsencrypt/"), base, delay = 1 }
end

-- Branding logos + UI assets (admin uploads customer logos here). Pre-create dir so first-run works.
os.execute("mkdir -p /opt/hostpanel/wwwroot/branding")
sync { default.rsync, source = "/opt/hostpanel/wwwroot/branding/", target = rsync_target("/opt/hostpanel/wwwroot/branding/"), base, delay = 1 }
